[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krishisethu-ai"
version = "0.1.0"
description = "KrishiSetu AI — safe-by-construction 4-tier hybrid decision & evidence engine (SIH 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain==1.4.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.11",
    "chromadb==1.5.9",
    "ollama==0.6.2",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "tiktoken==0.14.0",
    "requests==2.34.2",
    "httpx==0.28.1",
    "litellm==1.101.0",
    "jinja2==3.1.6",
    "weasyprint==70.0",
    "click==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[project.scripts]
krishisethu = "krishisethu.cli:main"

[tool.setuptools.packages.find]
include = ["krishisethu*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
